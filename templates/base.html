<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}家庭媒体库 · DLNA{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}?v={{ asset_version }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎬</text></svg>">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">◢</span>
    <span class="name">家庭媒体库</span>
    <span class="sub">v1 · NODE/{{ request.host.split(':')[0].split('.')[-1] }}</span>
    <span class="hud-status"><span class="dot"></span>SYSTEM ONLINE</span>
  </div>
  <nav class="nav">
    <span class="hud-clock" id="hud-clock">--:--:--</span>
    <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">首页</a>
    <a href="{{ url_for('browse', kind='video') }}" class="{% if request.endpoint == 'browse' and request.args.get('kind','all') == 'video' %}active{% endif %}">视频</a>
    <a href="{{ url_for('browse', kind='image') }}" class="{% if request.endpoint == 'browse' and request.args.get('kind') == 'image' %}active{% endif %}">照片</a>
    <a href="{{ url_for('browse', kind='audio') }}" class="{% if request.endpoint == 'browse' and request.args.get('kind') == 'audio' %}active{% endif %}">音乐</a>
    <a href="{{ url_for('settings_page') }}" class="{% if request.endpoint == 'settings_page' %}active{% endif %}">设置</a>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>NODE://minidlna-dashboard</span>
  <span class="dot">/</span>
  <span>PORT 8201</span>
  <span class="dot">/</span>
  <span>UPLINK <code>{{ request.host }}</code></span>
  <span class="dot">/</span>
  <span style="margin-left:auto;color:var(--accent)">◉ CONNECTED</span>
</footer>

<div id="modal" class="modal hidden" onclick="closeModal(event)">
  <div class="modal-body" onclick="event.stopPropagation()">
    <button class="close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='main.js') }}?v={{ asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
